<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket | GameManager</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">

  <!-- Select2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Navbar injected by shared.js -->

  <div class="page-content">
    <!-- Add Ticket button -->
    <div class="mb-3">
      <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#ticketModal">
        Add Ticket
      </button>
    </div>

    <div class="table-responsive">
      <table id="ticket-table" class="table table-striped table-hover table-bordered">
        <thead class="table-header-blue">
          <tr>
            <th>Machine No</th>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Employee</th>
            <th>Point</th>
            <th>Date</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Add Ticket Modal -->
  <div class="modal fade" id="ticketModal" tabindex="-1" aria-labelledby="ticketModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="ticketModalLabel">Add Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="ticketForm" onsubmit="event.preventDefault(); alert('This is a demo — no backend connected')">
            <div class="mb-3">
              <label class="form-label">Employee</label>
              <input type="text" class="form-control" value="zee" readonly>
            </div>
            <div class="mb-3">
              <label for="ticketCustomer" class="form-label">Customer</label>
              <select id="ticketCustomer" class="form-select" style="width:100%">
                <option value="">Search customer...</option>
                <option value="C001">C001 – John Smith</option>
                <option value="C002">C002 – Maria Garcia</option>
                <option value="C003">C003 – James Brown</option>
                <option value="C004">C004 – Linda White</option>
                <option value="C005">C005 – Robert Lee</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="ticketMachine" class="form-label">Machine</label>
              <input type="number" class="form-control" id="ticketMachine" min="1" placeholder="Machine number">
            </div>
            <div class="mb-3">
              <label for="ticketAmount" class="form-label">Ticket Amount</label>
              <input type="number" class="form-control" id="ticketAmount" min="0" placeholder="Amount">
            </div>
            <div class="mb-3">
              <label for="ticketDescription" class="form-label">Description</label>
              <input type="text" class="form-control" id="ticketDescription" placeholder="Optional description">
            </div>
            <div class="mb-3">
              <label class="form-label">Image</label><br>
              <button type="button" class="btn btn-secondary btn-sm"
                      onclick="GameManager.startCamera('cameraStream', 'cameraPopup')">
                Capture Image
              </button>
              <img id="displayImage" class="captured-display-img" src="" alt="Captured">
              <input type="hidden" id="ticket_image" value="">
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Ticket</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup backdrop -->
  <div id="popupBackdrop" onclick="GameManager.hideDetailPopup(); GameManager.hideCamera('cameraPopup')"></div>

  <!-- Camera popup (cameraPopup) — separate from detail popup -->
  <div id="cameraPopup">
    <button class="popup-close-btn" onclick="GameManager.hideCamera('cameraPopup')" aria-label="Close">&times;</button>
    <h5>Capture Image</h5>
    <video id="cameraStream" autoplay playsinline></video>
    <img id="capturedImage" src="" alt="Captured" style="display:none;">
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div class="d-flex gap-2 justify-content-center mt-2">
      <button class="btn btn-primary btn-sm"
              onclick="GameManager.captureImage('cameraStream','cameraCanvas','capturedImage')">
        Capture Image
      </button>
      <button class="btn btn-secondary btn-sm"
              onclick="GameManager.restartCamera('cameraStream','cameraCanvas','capturedImage','cameraPopup')">
        Recapture Image
      </button>
      <button class="btn btn-success btn-sm"
              onclick="GameManager.savePopup('cameraPopup','displayImage','ticket_image')">
        Save
      </button>
    </div>
  </div>

  <!-- Detail view popup (detailPopup) — row click -->
  <div id="detailPopup">
    <button class="popup-close-btn" onclick="GameManager.hideDetailPopup()" aria-label="Close">&times;</button>
    <h5>Ticket Details</h5>
    <div id="detailPopupContent"></div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <!-- Select2 -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <!-- Shared JS -->
  <script src="assets/js/shared.js"></script>
  <script>
    GameManager.renderNavbar('ticket', 'zee');
    GameManager.renderNavbarModals();

    var ticketColumns = ['Machine No', 'Customer ID', 'Name', 'Employee', 'Point', 'Date', 'Description'];
    var ticketData = [
      ["Machine 3", "C001", "John Smith",   "zee",     "200", "Jun 19, 2026 10:00 AM", "Regular play"],
      ["Machine 7", "C002", "Maria Garcia", "Lavon L", "500", "Jun 19, 2026 9:00 AM",  ""],
      ["Machine 1", "C003", "James Brown",  "Ana A",   "150", "Jun 18, 2026 8:00 PM",  "VIP session"],
      ["Machine 5", "C004", "Linda White",  "Nicho N", "300", "Jun 18, 2026 3:00 PM",  ""],
      ["Machine 2", "C005", "Robert Lee",   "Irene I", "450", "Jun 17, 2026 6:00 PM",  "Evening"]
    ];

    $(document).ready(function () {
      // Init Select2
      $('#ticketCustomer').select2({
        theme: 'bootstrap-5',
        placeholder: 'Search customer...',
        dropdownParent: $('#ticketModal')
      });

      // Init DataTable
      var table = $('#ticket-table').DataTable({
        data: ticketData,
        searchDelay: 500,
        order: [[5, 'desc']]
      });

      // Row click → detail popup
      $('#ticket-table tbody').on('click', 'tr', function () {
        var row = table.row(this).data();
        if (!row) return;
        var html = ticketColumns.map(function (col, i) {
          return '<div class="popup-field"><label>' + col + ':</label> ' + (row[i] || '—') + '</div>';
        }).join('');
        document.getElementById('detailPopupContent').innerHTML = html;
        GameManager.showDetailPopup();
      });
    });
  </script>
</body>
</html>
