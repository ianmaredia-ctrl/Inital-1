<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container">
      <div class="table-card">
        <div class="table-card-head">
          <h2>Shift Reports</h2>
          <div class="topbar-spacer"></div>
          <div class="d-flex align-items-end gap-2 flex-wrap">
            <div>
              <label for="daysFilter" class="form-label mb-1">Filter by days</label>
              <select class="form-select form-select-sm" id="daysFilter" onchange="console.log('Days filter: ' + this.value)">
                <option value="2">2 days</option><option value="5">5 days</option>
                <option value="10">10 days</option><option value="30">30 days</option>
                <option value="40">40 days</option><option value="90">90 days</option>
                <option value="all">All</option>
              </select>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="App.demo()">Select Shifts</button>
            <button class="btn btn-primary btn-sm" onclick="App.demo()">Generate Report</button>
          </div>
        </div>
        <div class="table-card-body">
          <div class="report-info-bar" style="background:var(--accent-soft);color:var(--accent-600);border-radius:9px;padding:9px 14px;font-size:.82rem;font-weight:600;margin:8px 0 14px;">
            Selected shift_ids are: 9653,
          </div>
          <div class="table-responsive">
            <table id="report-table" class="table table-hover" style="width:100%">
              <thead>
                <tr><th>Shift ID</th><th>Employee</th><th>Shift Start</th><th>Shift End</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'report', title: 'Reports' });

    var reportData = [
      ["16349", "N, Nicho",  "June 19 2026 12:06am",  "None"],
      ["16346", "L, Lavon",  "June 18 2026 6:20pm",   "None"],
      ["16340", "A, Ana",    "June 18 2026 5:08pm",   "June 19 2026 12:32am"],
      ["16327", "L, Lori",   "June 18 2026 8:05am",   "June 18 2026 6:18pm"],
      ["16322", "A, Ana",    "June 18 2026 1:49am",   "June 18 2026 8:10am"],
      ["16320", "A, Ana",    "June 18 2026 12:04am",  "June 18 2026 1:49am"],
      ["16314", "L, Lavon",  "June 17 2026 5:03pm",   "June 18 2026 12:09am"],
      ["16312", "N, Nicho",  "June 17 2026 4:47pm",   "June 17 2026 11:55pm"],
      ["16302", "I, Irene",  "June 17 2026 8:28am",   "June 17 2026 4:52pm"],
      ["16293", "JOB, Extra","June 17 2026 1:41am",   "June 17 2026 8:34am"]
    ];
    var rows = reportData.map(function (r) {
      return ['<input type="checkbox" class="form-check-input shift-checkbox" value="' + r[0] + '"> ' + r[0], r[1], r[2], r[3]];
    });

    $(document).ready(function () {
      $('#report-table').DataTable({ data: rows, searchDelay: 500, order: [[0, 'desc']], columnDefs: [{ orderable: false, targets: 0 }] });
    });
  </script>
</body>
</html>
