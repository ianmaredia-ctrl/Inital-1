<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report | GameManager</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Navbar injected by shared.js -->

  <div class="page-content">
    <!-- Filter controls -->
    <div class="row align-items-end g-2 mb-3">
      <div class="col-auto">
        <label for="daysFilter" class="form-label mb-1">Filter by days</label>
        <select class="form-select form-select-sm" id="daysFilter"
                onchange="console.log('Days filter changed to: ' + this.value)">
          <option value="2">2 days</option>
          <option value="5">5 days</option>
          <option value="10">10 days</option>
          <option value="30">30 days</option>
          <option value="40">40 days</option>
          <option value="90">90 days</option>
          <option value="all">All</option>
        </select>
      </div>
      <div class="col-auto">
        <button class="btn btn-outline-secondary btn-sm"
                onclick="alert('This is a demo')">Select Shifts</button>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary btn-sm"
                onclick="alert('This is a demo')">Generate Report</button>
      </div>
    </div>

    <!-- Info bar -->
    <div class="report-info-bar">
      Selected shift_ids are: 9653,
    </div>

    <div class="table-responsive">
      <table id="report-table" class="table table-striped table-hover table-bordered">
        <thead class="table-header-blue">
          <tr>
            <th>Shift ID</th>
            <th>Employee</th>
            <th>Shift Start</th>
            <th>Shift End</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Popup backdrop -->
  <div id="popupBackdrop"></div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <!-- Shared JS -->
  <script src="assets/js/shared.js"></script>
  <script>
    GameManager.renderNavbar('report', 'zee');
    GameManager.renderNavbarModals();

    var reportData = [
      ["16349", "N, Nicho",  "June 19 2026 12:06am",  "None"],
      ["16346", "L, Lavon",  "June 18 2026 6:20pm",   "None"],
      ["16340", "A, Ana",    "June 18 2026 5:08pm",   "June 19 2026 12:32am"],
      ["16327", "L, Lori",   "June 18 2026 8:05am",   "June 18 2026 6:18pm"],
      ["16322", "A, Ana",    "June 18 2026 1:49am",   "June 18 2026 8:10am"],
      ["16320", "A, Ana",    "June 18 2026 12:04am",  "June 18 2026 1:49am"],
      ["16314", "L, Lavon",  "June 17 2026 5:03pm",   "June 18 2026 12:09am"],
      ["16312", "N, Nicho",  "June 17 2026 4:47pm",   "June 17 2026 11:55pm"],
      ["16302", "I, Irene",  "June 17 2026 8:28am",   "June 17 2026 4:52pm"],
      ["16293", "JOB, Extra","June 17 2026 1:41am",   "June 17 2026 8:34am"]
    ];

    // Render with checkbox in first column
    var reportDataWithCheckbox = reportData.map(function (row) {
      return [
        '<input type="checkbox" class="form-check-input shift-checkbox" value="' + row[0] + '"> ' + row[0],
        row[1],
        row[2],
        row[3]
      ];
    });

    $(document).ready(function () {
      $('#report-table').DataTable({
        data: reportDataWithCheckbox,
        searchDelay: 500,
        order: [[0, 'desc']],
        columnDefs: [{ orderable: false, targets: 0 }]
      });
    });
  </script>
</body>
</html>
