<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense | GameManager</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">

  <!-- Select2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Navbar injected by shared.js -->

  <div class="page-content">
    <!-- Add Expenses button -->
    <div class="mb-3">
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal">
        Add Expenses
      </button>
    </div>

    <div class="table-responsive">
      <table id="expense-table" class="table table-striped table-hover table-bordered">
        <thead class="table-header-blue">
          <tr>
            <th>Date</th>
            <th>Machine</th>
            <th>Amount</th>
            <th>Expense Type</th>
            <th>Description</th>
            <th>Customer ID</th>
            <th>Employee</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Add Expense Modal -->
  <div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="expenseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="expenseModalLabel">Add Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="expenseForm" onsubmit="event.preventDefault(); alert('This is a demo — no backend connected')">
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="text" class="form-control" id="expenseDate" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Employee</label>
              <input type="text" class="form-control" value="zee" readonly>
            </div>
            <div class="mb-3">
              <label for="expenseType" class="form-label">Expense Type</label>
              <select class="form-select" id="expenseType">
                <option value="">Select type...</option>
                <option value="Bank Received">Bank Received</option>
                <option value="Bank Given">Bank Given</option>
                <option value="Promotions">Promotions</option>
                <option value="Raffles">Raffles</option>
                <option value="Employee Pay">Employee Pay</option>
                <option value="Security Pay">Security Pay</option>
                <option value="Food Expense">Food Expense</option>
                <option value="Grocery Expense">Grocery Expense</option>
                <option value="Other Expense">Other Expense</option>
                <option value="Match Expenses">Match Expenses</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="expenseAmount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="expenseAmount" min="0" placeholder="Amount">
            </div>
            <div class="mb-3">
              <label for="expenseDescription" class="form-label">Description</label>
              <input type="text" class="form-control" id="expenseDescription" placeholder="Optional description">
            </div>
            <div class="mb-3">
              <label for="expenseCustomer" class="form-label">Customer</label>
              <select id="expenseCustomer" class="form-select" style="width:100%">
                <option value="">Search customer (optional)...</option>
                <option value="C001">C001 – John Smith</option>
                <option value="C002">C002 – Maria Garcia</option>
                <option value="C003">C003 – James Brown</option>
                <option value="C004">C004 – Linda White</option>
                <option value="C005">C005 – Robert Lee</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="expenseMachine" class="form-label">Machine</label>
              <input type="number" class="form-control" id="expenseMachine" min="1" placeholder="Machine number (optional)">
            </div>
            <div class="mb-3">
              <label class="form-label">Image</label><br>
              <button type="button" class="btn btn-secondary btn-sm"
                      onclick="GameManager.startCamera('cameraStream', 'cameraPopup')">
                Capture Image
              </button>
              <img id="displayImage" class="captured-display-img" src="" alt="Captured">
              <input type="hidden" id="expense_image" value="">
            </div>
            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup backdrop -->
  <div id="popupBackdrop" onclick="GameManager.hideDetailPopup(); GameManager.hideCamera('cameraPopup')"></div>

  <!-- Camera popup (cameraPopup) -->
  <div id="cameraPopup">
    <button class="popup-close-btn" onclick="GameManager.hideCamera('cameraPopup')" aria-label="Close">&times;</button>
    <h5>Capture Image</h5>
    <video id="cameraStream" autoplay playsinline></video>
    <img id="capturedImage" src="" alt="Captured" style="display:none;">
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div class="d-flex gap-2 justify-content-center mt-2">
      <button class="btn btn-primary btn-sm"
              onclick="GameManager.captureImage('cameraStream','cameraCanvas','capturedImage')">
        Capture Image
      </button>
      <button class="btn btn-secondary btn-sm"
              onclick="GameManager.restartCamera('cameraStream','cameraCanvas','capturedImage','cameraPopup')">
        Recapture Image
      </button>
      <button class="btn btn-success btn-sm"
              onclick="GameManager.savePopup('cameraPopup','displayImage','expense_image')">
        Save
      </button>
    </div>
  </div>

  <!-- Detail view popup (detailPopup) -->
  <div id="detailPopup">
    <button class="popup-close-btn" onclick="GameManager.hideDetailPopup()" aria-label="Close">&times;</button>
    <h5>Expense Details</h5>
    <div id="detailPopupContent"></div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <!-- Select2 -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <!-- Shared JS -->
  <script src="assets/js/shared.js"></script>
  <script>
    GameManager.renderNavbar('expenses', 'zee');
    GameManager.renderNavbarModals();

    // Set current date in form
    document.getElementById('expenseDate').value = new Date().toLocaleString();

    var expenseColumns = ['Date', 'Machine', 'Amount', 'Expense Type', 'Description', 'Customer ID', 'Employee'];
    var expenseData = [
      ["Jun 19, 2026 10:00 AM", "3",  "500",  "Bank Received",   "Daily deposit",    "C001", "zee"],
      ["Jun 19, 2026 9:00 AM",  "",   "150",  "Promotions",      "Player promotion", "",     "zee"],
      ["Jun 18, 2026 8:00 PM",  "7",  "200",  "Food Expense",    "Staff food",       "",     "Lavon L"],
      ["Jun 18, 2026 3:00 PM",  "",   "1000", "Bank Given",      "Withdrawal",       "",     "Ana A"],
      ["Jun 17, 2026 6:00 PM",  "1",  "75",   "Grocery Expense", "Supplies",         "",     "Irene I"]
    ];

    $(document).ready(function () {
      // Init Select2
      $('#expenseCustomer').select2({
        theme: 'bootstrap-5',
        placeholder: 'Search customer (optional)...',
        allowClear: true,
        dropdownParent: $('#expenseModal')
      });

      // Init DataTable
      var table = $('#expense-table').DataTable({
        data: expenseData,
        searchDelay: 500,
        order: [[0, 'desc']]
      });

      // Row click → detail popup
      $('#expense-table tbody').on('click', 'tr', function () {
        var row = table.row(this).data();
        if (!row) return;
        var html = expenseColumns.map(function (col, i) {
          return '<div class="popup-field"><label>' + col + ':</label> ' + (row[i] || '—') + '</div>';
        }).join('');
        document.getElementById('detailPopupContent').innerHTML = html;
        GameManager.showDetailPopup();
      });
    });
  </script>
</body>
</html>
