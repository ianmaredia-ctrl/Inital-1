<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Expenses | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container">
      <div class="table-card">
        <div class="table-card-head">
          <h2>Bank Expenses</h2>
          <div class="topbar-spacer"></div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal">+ Add Expense</button>
        </div>
        <div class="table-card-body">
          <div class="table-responsive">
            <table id="expense-table" class="table table-hover" style="width:100%">
              <thead>
                <tr>
                  <th>Date</th><th>Machine</th><th>Amount</th><th>Expense Type</th>
                  <th>Description</th><th>Customer ID</th><th>Employee</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Expense Modal -->
  <div class="modal fade" id="expenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form onsubmit="event.preventDefault(); App.demo()">
            <div class="field-row">
              <div class="mb-3"><label class="form-label">Date</label>
                <input type="text" class="form-control" id="expenseDate" readonly></div>
              <div class="mb-3"><label class="form-label">Employee</label>
                <input type="text" class="form-control" value="zee" readonly></div>
              <div class="mb-3"><label class="form-label" for="expenseType">Expense Type</label>
                <select class="form-select" id="expenseType">
                  <option value="">Select type...</option>
                  <option>Bank Received</option><option>Bank Given</option><option>Promotions</option>
                  <option>Raffles</option><option>Employee Pay</option><option>Security Pay</option>
                  <option>Food Expense</option><option>Grocery Expense</option><option>Other Expense</option>
                  <option>Match Expenses</option>
                </select>
              </div>
              <div class="mb-3"><label class="form-label">Amount</label>
                <input type="number" class="form-control" min="0" placeholder="Amount"></div>
              <div class="mb-3"><label class="form-label" for="expenseCustomer">Customer</label>
                <select id="expenseCustomer" class="form-select" style="width:100%">
                  <option value="">Search customer (optional)...</option>
                  <option value="C001">C001 — John Smith</option>
                  <option value="C002">C002 — Maria Garcia</option>
                  <option value="C003">C003 — James Brown</option>
                  <option value="C004">C004 — Linda White</option>
                  <option value="C005">C005 — Robert Lee</option>
                </select>
              </div>
              <div class="mb-3"><label class="form-label">Machine</label>
                <input type="number" class="form-control" min="1" placeholder="Machine number (optional)"></div>
            </div>
            <div class="mb-3"><label class="form-label">Description</label>
              <input type="text" class="form-control" placeholder="Optional description"></div>
            <div class="mb-3">
              <label class="form-label d-block">Image</label>
              <button type="button" class="btn btn-secondary btn-sm" onclick="App.startCamera('cameraStream','cameraPopup')">Capture Image</button>
              <img id="displayImage" class="captured-display-img" src="" alt="Captured">
              <input type="hidden" id="expense_image" value="">
            </div>
            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="popupBackdrop" onclick="App.hideDetailPopup(); App.hideCamera('cameraPopup')"></div>

  <div id="cameraPopup">
    <button class="popup-close-btn" onclick="App.hideCamera('cameraPopup')" aria-label="Close">&times;</button>
    <h5>Capture Image</h5>
    <video id="cameraStream" autoplay playsinline></video>
    <img id="capturedImage" src="" alt="Captured" style="display:none;">
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div class="d-flex gap-2 justify-content-center mt-2">
      <button class="btn btn-primary btn-sm" onclick="App.captureImage('cameraStream','cameraCanvas','capturedImage')">Capture</button>
      <button class="btn btn-secondary btn-sm" onclick="App.restartCamera('cameraStream','cameraCanvas','capturedImage','cameraPopup')">Recapture</button>
      <button class="btn btn-success btn-sm" onclick="App.savePopup('cameraPopup','displayImage','expense_image')">Save</button>
    </div>
  </div>

  <div id="detailPopup">
    <button class="popup-close-btn" onclick="App.hideDetailPopup()" aria-label="Close">&times;</button>
    <h5>Expense Details</h5>
    <div id="detailPopupContent"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'expenses', title: 'Bank Expenses' });
    document.getElementById('expenseDate').value = new Date().toLocaleString();

    var expenseColumns = ['Date', 'Machine', 'Amount', 'Expense Type', 'Description', 'Customer ID', 'Employee'];
    var expenseData = [
      ["Jun 19, 2026 10:00 AM", "3",  "500",  "Bank Received",   "Daily deposit",    "C001", "zee"],
      ["Jun 19, 2026 9:00 AM",  "",   "150",  "Promotions",      "Player promotion", "",     "zee"],
      ["Jun 18, 2026 8:00 PM",  "7",  "200",  "Food Expense",    "Staff food",       "",     "Lavon L"],
      ["Jun 18, 2026 3:00 PM",  "",   "1000", "Bank Given",      "Withdrawal",       "",     "Ana A"],
      ["Jun 17, 2026 6:00 PM",  "1",  "75",   "Grocery Expense", "Supplies",         "",     "Irene I"]
    ];

    $(document).ready(function () {
      $('#expenseCustomer').select2({ theme: 'bootstrap-5', placeholder: 'Search customer (optional)...', allowClear: true, dropdownParent: $('#expenseModal') });
      var table = $('#expense-table').DataTable({ data: expenseData, searchDelay: 500, order: [[0, 'desc']] });
      $('#expense-table tbody').on('click', 'tr', function () {
        var row = table.row(this).data();
        if (!row) return;
        App.fillDetail('detailPopupContent', expenseColumns, row);
        App.showDetailPopup();
      });
    });
  </script>
</body>
</html>
