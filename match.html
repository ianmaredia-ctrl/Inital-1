<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matches | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container">
      <div class="table-card">
        <div class="table-card-head">
          <h2>Matches</h2>
          <div class="topbar-spacer"></div>
        </div>
        <div class="table-card-body">
          <div class="table-responsive">
            <table id="match-table" class="table table-hover" style="width:100%">
              <thead>
                <tr>
                  <th>Sign In</th><th>ID</th><th>Name</th><th>Employee</th>
                  <th>Match Type</th><th>Point</th><th>Machine</th><th>Update Time</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="popupBackdrop" onclick="App.hideDetailPopup()"></div>
  <div id="detailPopup">
    <button class="popup-close-btn" onclick="App.hideDetailPopup()" aria-label="Close">&times;</button>
    <h5>Match Details</h5>
    <div id="detailPopupContent"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'match', title: 'Matches' });

    var matchColumns = ['Sign In', 'ID', 'Name', 'Employee', 'Match Type', 'Point', 'Machine', 'Update Time'];
    var matchData = [
      ["Jun 19, 2026 10:00 AM", "C001", "John Smith",   "Lavon L", "Regular", "500",  "Machine 3", "Jun 19, 2026 11:00 AM"],
      ["Jun 19, 2026 9:00 AM",  "C002", "Maria Garcia", "Ana A",   "VIP",     "1200", "Machine 7", "Jun 19, 2026 10:30 AM"],
      ["Jun 18, 2026 8:00 PM",  "C003", "James Brown",  "Nicho N", "Regular", "300",  "Machine 1", "Jun 18, 2026 9:00 PM"],
      ["Jun 18, 2026 3:00 PM",  "C004", "Linda White",  "Lori L",  "Rematch", "800",  "Machine 5", "Jun 18, 2026 4:00 PM"],
      ["Jun 17, 2026 6:00 PM",  "C005", "Robert Lee",   "Irene I", "Regular", "600",  "Machine 2", "Jun 17, 2026 7:00 PM"]
    ];

    $(document).ready(function () {
      var table = $('#match-table').DataTable({ data: matchData, searchDelay: 500, order: [[0, 'desc']] });
      $('#match-table tbody').on('click', 'tr', function () {
        var row = table.row(this).data();
        if (!row) return;
        App.fillDetail('detailPopupContent', matchColumns, row);
        App.showDetailPopup();
      });
    });
  </script>
</body>
</html>
