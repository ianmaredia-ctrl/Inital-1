<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container page-narrow">
      <p class="page-lead">Leave a note for the team. Notes are kept per store.</p>

      <div class="card-surface mb-3">
        <div class="card-head">
          <span class="stat-icon i-amber" style="width:38px;height:38px"><svg viewBox="0 0 24 24" id="hi"></svg></span>
          <h2>New Note</h2>
        </div>
        <div class="card-body">
          <form id="noteForm">
            <div class="mb-3">
              <textarea class="form-control" id="noteText" rows="3" placeholder="Write a note..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Note</button>
          </form>
        </div>
      </div>

      <div id="noteList"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'note', title: 'Note' });
    document.getElementById('hi').innerHTML = App.svg('note').replace(/<svg[^>]*>|<\/svg>/g,'');

    var notes = [
      { who: 'zee',     when: 'Jun 19, 2026 9:12 AM', text: 'Machine 5 needs a service check — coin jam reported twice.' },
      { who: 'Lavon L', when: 'Jun 18, 2026 7:40 PM', text: 'Restocked register float. Closing balance handed to manager.' }
    ];

    function render() {
      document.getElementById('noteList').innerHTML = notes.map(function (n) {
        return '<div class="card-surface" style="margin-bottom:12px"><div class="card-body" style="padding:16px 18px">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:6px">' +
          '<strong style="font-size:.85rem">' + n.who + '</strong>' +
          '<span style="color:var(--muted);font-size:.76rem">' + n.when + '</span></div>' +
          '<div style="font-size:.9rem;color:var(--ink-soft)">' + n.text + '</div></div></div>';
      }).join('');
    }
    render();

    document.getElementById('noteForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var t = document.getElementById('noteText').value.trim();
      if (!t) return;
      notes.unshift({ who: 'zee', when: new Date().toLocaleString(), text: t });
      document.getElementById('noteText').value = '';
      render();
    });
  </script>
</body>
</html>
