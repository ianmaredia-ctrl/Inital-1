<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insert Data | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container page-narrow">
      <p class="page-lead">Insert machine readings for a store and date.</p>
      <div class="card-surface">
        <div class="card-head">
          <span class="stat-icon i-indigo" style="width:38px;height:38px"><svg viewBox="0 0 24 24" id="hi"></svg></span>
          <h2>Insert Game Data</h2>
        </div>
        <div class="card-body">
          <form onsubmit="event.preventDefault(); App.demo()">
            <div class="field-row">
              <div class="mb-3">
                <label class="form-label" for="storeName">Select Current Store</label>
                <select class="form-select" id="storeName" required>
                  <option value="">Open this select menu</option>
                  <option value="THEPALACE">THEPALACE</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="date">Select Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="machine">Machine Number</label>
                <input type="number" class="form-control" id="machine" min="1" placeholder="Machine number" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="cashIn">Cash In</label>
                <input type="number" class="form-control" id="cashIn" min="0" step="0.01" placeholder="0.00" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="cashOut">Cash Out</label>
                <input type="number" class="form-control" id="cashOut" min="0" step="0.01" placeholder="0.00" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="notes">Notes</label>
                <input type="text" class="form-control" id="notes" placeholder="Optional notes">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Insert</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'insert', title: 'Insert Data' });
    document.getElementById('hi').innerHTML = App.svg('plus').replace(/<svg[^>]*>|<\/svg>/g,'');
  </script>
</body>
</html>
