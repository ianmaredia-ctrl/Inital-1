<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container page-narrow">
      <p class="page-lead">Record a store expense for accounting.</p>
      <div class="card-surface">
        <div class="card-head">
          <span class="stat-icon i-amber" style="width:38px;height:38px"><svg viewBox="0 0 24 24" id="hi"></svg></span>
          <h2>Add Expense</h2>
        </div>
        <div class="card-body">
          <form onsubmit="event.preventDefault(); App.demo()">
            <div class="field-row">
              <div class="mb-3">
                <label class="form-label" for="storeName">Select Current Store</label>
                <select class="form-select" id="storeName" required>
                  <option value="">Open this select menu</option>
                  <option value="THEPALACE">THEPALACE</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="date">Select Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="category">Expense Category</label>
                <select class="form-select" id="category" required>
                  <option value="">Select category...</option>
                  <option>Rent</option><option>Utilities</option><option>Payroll</option>
                  <option>Maintenance</option><option>Supplies</option><option>Marketing</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="amount">Amount</label>
                <input type="number" class="form-control" id="amount" min="0" step="0.01" placeholder="0.00" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="description">Description</label>
              <input type="text" class="form-control" id="description" placeholder="Enter description">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'acc-expenses', title: 'Expenses' });
    document.getElementById('hi').innerHTML = App.svg('dollar').replace(/<svg[^>]*>|<\/svg>/g,'');
  </script>
</body>
</html>
