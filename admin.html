<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container">
      <p class="page-lead">Manage stores, staff access and system settings.</p>

      <div class="section-label">Management</div>
      <div class="tile-grid">
        <a class="tile" href="employee.html"><span class="tile-ic" data-ic="employee"></span><span class="tile-tx"><strong>Manage Staff</strong><span>Employees & roles</span></span></a>
        <a class="tile" href="select-store.html"><span class="tile-ic" data-ic="store"></span><span class="tile-tx"><strong>Stores</strong><span>Add / switch store</span></span></a>
        <a class="tile" href="customer.html"><span class="tile-ic" data-ic="customer"></span><span class="tile-tx"><strong>Customers</strong><span>Customer records</span></span></a>
        <a class="tile" href="#" onclick="App.demo();return false;"><span class="tile-ic" data-ic="settings"></span><span class="tile-tx"><strong>Settings</strong><span>System preferences</span></span></a>
      </div>

      <div class="section-label">Store Settings</div>
      <div class="card-surface page-narrow">
        <div class="card-head"><h2>THEPALACE</h2></div>
        <div class="card-body">
          <form onsubmit="event.preventDefault(); App.demo()">
            <div class="field-row">
              <div class="mb-3"><label class="form-label">Store Display Name</label>
                <input type="text" class="form-control" value="The-Palace"></div>
              <div class="mb-3"><label class="form-label">Store Code</label>
                <input type="text" class="form-control" value="THEPALACE"></div>
              <div class="mb-3"><label class="form-label">Timezone</label>
                <select class="form-select"><option>America/Chicago</option><option>America/New_York</option><option>America/Los_Angeles</option></select></div>
              <div class="mb-3"><label class="form-label">Currency</label>
                <select class="form-select"><option>USD ($)</option><option>EUR (€)</option></select></div>
            </div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'admin', title: 'Admin' });
    document.querySelectorAll('.tile-ic[data-ic]').forEach(function(el){ el.innerHTML = App.svg(el.dataset.ic); });
  </script>
</body>
</html>
