<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container page-narrow">
      <p class="page-lead">Summarize performance across a date range.</p>
      <div class="card-surface">
        <div class="card-head">
          <span class="stat-icon i-indigo" style="width:38px;height:38px"><svg viewBox="0 0 24 24" id="hi"></svg></span>
          <h2>Range Summary</h2>
        </div>
        <div class="card-body">
          <form onsubmit="event.preventDefault(); App.demo()">
            <div class="mb-3">
              <label class="form-label" for="storeName">Select Current Store</label>
              <select class="form-select" id="storeName" required>
                <option value="">Open this select menu</option>
                <option value="THEPALACE">THEPALACE</option>
              </select>
            </div>
            <div class="field-row">
              <div class="mb-4">
                <label class="form-label" for="fromDate">Select From Date</label>
                <input type="date" class="form-control" id="fromDate" required>
              </div>
              <div class="mb-4">
                <label class="form-label" for="toDate">Select To Date</label>
                <input type="date" class="form-control" id="toDate" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'summary', title: 'Summary' });
    document.getElementById('hi').innerHTML = App.svg('pie').replace(/<svg[^>]*>|<\/svg>/g,'');
  </script>
</body>
</html>
