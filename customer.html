<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container">
      <div class="table-card">
        <div class="table-card-head">
          <h2>Customers</h2>
          <div class="topbar-spacer"></div>
          <button class="btn btn-outline-primary" onclick="App.demo()">Download</button>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal">+ Add Customer</button>
        </div>
        <div class="table-card-body">
          <div class="table-responsive">
            <table id="customer-table" class="table table-hover" style="width:100%">
              <thead>
                <tr>
                  <th>ID</th><th>First Name</th><th>Last Name</th><th>Phone No</th><th>Created By</th>
                  <th>Last Visit</th><th>Visits</th><th>Ban</th><th>Match</th><th>Re-Match</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Customer Modal -->
  <div class="modal fade" id="customerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form onsubmit="event.preventDefault(); App.demo()">
            <div class="field-row">
              <div class="mb-3"><label class="form-label">First Name</label>
                <input type="text" class="form-control" placeholder="First name"></div>
              <div class="mb-3"><label class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Last name"></div>
              <div class="mb-3"><label class="form-label">Phone No</label>
                <input type="text" class="form-control" placeholder="Phone number"></div>
              <div class="mb-3"><label class="form-label">Employee Id</label>
                <input type="text" class="form-control" value="zee" readonly></div>
              <div class="mb-3"><label class="form-label">Store Name</label>
                <select class="form-select"><option>The-Palace</option></select></div>
            </div>
            <div class="mb-3">
              <label class="form-label d-block">Image</label>
              <button type="button" class="btn btn-secondary btn-sm" onclick="App.startCamera('cameraStream','cameraPopup')">Capture Image</button>
              <img id="displayImage" class="captured-display-img" src="" alt="Captured">
              <input type="hidden" id="customer_image" value="">
            </div>
            <button type="submit" class="btn btn-primary w-100">Add Customer</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="popupBackdrop" onclick="App.hideDetailPopup(); App.hideCamera('cameraPopup')"></div>

  <div id="cameraPopup">
    <button class="popup-close-btn" onclick="App.hideCamera('cameraPopup')" aria-label="Close">&times;</button>
    <h5>Capture Image</h5>
    <video id="cameraStream" autoplay playsinline></video>
    <img id="capturedImage" src="" alt="Captured" style="display:none;">
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div class="d-flex gap-2 justify-content-center mt-2">
      <button class="btn btn-primary btn-sm" onclick="App.captureImage('cameraStream','cameraCanvas','capturedImage')">Capture</button>
      <button class="btn btn-secondary btn-sm" onclick="App.restartCamera('cameraStream','cameraCanvas','capturedImage','cameraPopup')">Recapture</button>
      <button class="btn btn-success btn-sm" onclick="App.savePopup('cameraPopup','displayImage','customer_image')">Save</button>
    </div>
  </div>

  <div id="detailPopup" class="popup-large">
    <button class="popup-close-btn" onclick="App.hideDetailPopup()" aria-label="Close">&times;</button>
    <h5>Customer Details</h5>
    <div id="detailPopupContent"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'customer', title: 'Customers' });

    var customerColumns = ['ID', 'First Name', 'Last Name', 'Phone No', 'Created By', 'Last Visit', 'Visit Count', 'Ban', 'Match', 'Re-Match'];
    var customerData = [
      ["C001", "John",   "Smith",  "555-1234", "zee",     "Jun 19 2026 10:00 AM", "5",  "No",  "500", "0"],
      ["C002", "Maria",  "Garcia", "555-5678", "zee",     "Jun 19 2026 9:00 AM",  "12", "No",  "1200","200"],
      ["C003", "James",  "Brown",  "555-9012", "Ana A",   "Jun 18 2026 8:00 PM",  "3",  "No",  "300", "0"],
      ["C004", "Linda",  "White",  "555-3456", "Lavon L", "Jun 18 2026 3:00 PM",  "8",  "No",  "800", "100"],
      ["C005", "Robert", "Lee",    "555-7890", "zee",     "Jun 17 2026 6:00 PM",  "2",  "Yes", "600", "0"]
    ];

    $(document).ready(function () {
      var table = $('#customer-table').DataTable({
        data: customerData, searchDelay: 500, order: [[5, 'desc']],
        createdRow: function (row, data) { if (data[7] === 'Yes') $(row).addClass('table-danger'); }
      });
      $('#customer-table tbody').on('click', 'tr', function () {
        var row = table.row(this).data();
        if (!row) return;
        App.fillDetail('detailPopupContent', customerColumns, row);
        App.showDetailPopup();
      });
    });
  </script>
</body>
</html>
