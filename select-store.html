<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Store | The-Palace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="app-main">
    <div class="page-container">
      <p class="page-lead">Choose the store you'd like to manage.</p>

      <div class="tile-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
        <a class="tile" href="index.html" style="padding:22px">
          <span class="tile-ic" data-ic="store" style="width:48px;height:48px"></span>
          <span class="tile-tx">
            <strong style="font-size:1rem">THEPALACE</strong>
            <span>The-Palace — active</span>
          </span>
        </a>
        <button class="tile" onclick="App.demo()" style="padding:22px;border-style:dashed;background:transparent;cursor:pointer;text-align:left">
          <span class="tile-ic" data-ic="plus" style="width:48px;height:48px;background:#eef0f4;color:var(--muted)"></span>
          <span class="tile-tx">
            <strong style="font-size:1rem">Add Store</strong>
            <span>Register a new location</span>
          </span>
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/shared.js"></script>
  <script>
    App.initShell({ active: 'store', title: 'Select Store' });
    document.querySelectorAll('.tile-ic[data-ic]').forEach(function(el){ el.innerHTML = App.svg(el.dataset.ic); });
  </script>
</body>
</html>
